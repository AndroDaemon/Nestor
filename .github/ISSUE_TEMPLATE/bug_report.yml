name: Bug report
description: Сообщить об ошибке в работе Nestor
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Чем точнее детали, тем быстрее получится
        воспроизвести проблему. Уязвимости — не здесь, а по
        [SECURITY.md](https://github.com/AndroDaemon/Nestor/blob/master/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Версия Nestor
      description: Видна в шапке окна, в «?» → о программе или в `nestor --version`.
      placeholder: "1.3.7"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Как установлено
      options:
        - Установщик Nestor-Setup (exe)
        - Из исходников (`pip install -e .`)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: ОС и версия
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: Процессор и объём ОЗУ
      placeholder: "Intel Core i5-1235U, 16 ГБ"
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: Версия ffmpeg
      description: Вывод `ffmpeg -version` (первая строка).
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Опишите, что вы сделали и что получилось.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть…
        2. Нажать…
        3. …
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Журнал работы
      description: |
        Приложение пишет журнал в `%LOCALAPPDATA%\Nestor\log.txt`
        (кнопка «Открыть журнал» в разделе «?»). Вставьте последние строки.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Подтверждение
      options:
        - label: Я не приложил реальную запись с персональными данными (или обезличил её).
          required: true
