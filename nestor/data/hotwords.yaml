# Nestor hotwords.yaml — сфокусированный глоссарий
# Области: Разработка ПО, ИТ-инфраструктура, Виртуализация, Сотовая связь
#
# Формат:
#   - term:    каноническая (желаемая) форма, которую Nestor должен выдать
#   - aliases: как термин звучит / как его пишут — варианты для распознавания
#
# Роли на двух слоях (см. README):
#   * term    -> слой A (biasing декодера): биасим именно к канонической форме
#   * aliases -> слой B (постобработка): заменяем услышанный вариант на term

