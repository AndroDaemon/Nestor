[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nestor"
version = "1.3.7"
description = "Offline transcription and speaker diarization for Russian audio on CPU (GigaAM v3 punct + sherpa-onnx)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "sherpa-onnx>=1.13",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "av>=12.0.0,<13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/AndroDaemon/Nestor"
Repository = "https://github.com/AndroDaemon/Nestor"
Issues = "https://github.com/AndroDaemon/Nestor/issues"
Changelog = "https://github.com/AndroDaemon/Nestor/blob/master/docs/README-releases.md"

[project.scripts]
nestor = "nestor.cli:main"

[tool.setuptools.packages.find]
include = ["nestor*"]

# The web interface and sample assets ship inside the wheel as package data;
# without this a plain `pip install nestor` would get the app without its UI.
[tool.setuptools.package-data]
nestor = ["web/static/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
